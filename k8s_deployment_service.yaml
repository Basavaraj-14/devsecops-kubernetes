apiVersion: apps/v1
kind: Deployment
metadata:
    name: my-dp
    labels:
        app: devsecops
spec:
    replicas: 2
    selector:
        matchLabels:
            app: devsecops
    template:
        metadata:
            labels:
                app: devsecops
        spec:
            containers:
                - name: devsecops-container
                  image: replace
---
apiVersion: v1
kind: Service
metadata:
    name: my-svc
    labels:
        app: devsecops
spec:
    ports:
        - port: 8080
          protocol: TCP
          targetPort: 8080
    selector:
        app: devsecops
    type: NodePort
